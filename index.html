<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol-RED 맵 목록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-list">
  <header class="topbar">
    <h1>Protocol-RED 맵 목록</h1>
    <div class="top-actions">
      <button id="btn-new-map" class="primary">＋ 새 맵</button>
      <button id="btn-export">전체 내보내기</button>
      <label class="file-btn">불러오기<input type="file" id="input-import" accept=".json,application/json" hidden></label>
    </div>
  </header>
  <p class="hint">맵은 이 브라우저에 자동으로 저장돼요. 브라우저 기록을 지우면 사라질 수 있으니 가끔 <b>전체 내보내기</b>로 파일을 받아 두세요.</p>
  <div id="quota-banner" class="banner hidden" role="alert"></div>
  <div id="list-message" class="banner hidden" role="status"></div>
  <p id="empty-hint" class="empty">아직 맵이 없어요. "새 맵"을 눌러 시작하세요.</p>
  <main id="map-grid"></main>

  <script src="data/blocks.js"></script>
  <script src="js/mapmodel.js"></script>
  <script src="js/mapformat.js"></script>
  <script src="js/viewmath.js"></script>
  <script src="js/store.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/render.js"></script>
  <script src="js/maplist.js"></script>
</body>
</html>
